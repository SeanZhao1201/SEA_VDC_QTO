name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # v1.2.0 shipped stamped 1.0.3.0 because AssemblyInfo.cs was not bumped
      # before tagging. Rhino's plugin manager and every bug report read the
      # assembly, not the tag, so a mismatch breaks version-to-commit tracing.
      - name: Check tag matches AssemblyFileVersion
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $info = Get-Content QTO_Tool\Properties\AssemblyInfo.cs -Raw
          if ($info -notmatch '(?m)^\[assembly: AssemblyFileVersion\("([^"]+)"\)\]') {
            throw "Could not read AssemblyFileVersion from AssemblyInfo.cs"
          }
          $assembly = $Matches[1]
          # Tag is 3-part (v1.2.0), the attribute is 4-part (1.2.0.0): compare the first three.
          $tagParts = ($tag -split '\.')
          $asmParts = ($assembly -split '\.')
          $tagKey = ($tagParts[0..([Math]::Min(2, $tagParts.Count - 1))] -join '.')
          $asmKey = ($asmParts[0..([Math]::Min(2, $asmParts.Count - 1))] -join '.')
          if ($tagKey -ne $asmKey) {
            throw "Tag $tag does not match AssemblyFileVersion $assembly. Bump QTO_Tool\Properties\AssemblyInfo.cs before tagging."
          }
          Write-Host "OK: tag $tag matches AssemblyFileVersion $assembly"

      - name: Build plugin
        run: dotnet build QTO_Tool\QTO_Tool.csproj -c Release

      - name: Build Turner_Seattle_VDC_Server
        run: dotnet build Turner_Seattle_VDC_Server\Turner_Seattle_VDC_Server.csproj -c Release

      - name: Stage plugin files
        shell: pwsh
        run: |
          Copy-Item QTO_Tool\bin\Release\net48 dist -Recurse
          Get-ChildItem dist -Recurse -Filter *.pdb | Remove-Item

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTO_Tool
          path: dist

      - name: Zip release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath QTO_Tool.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QTO_Tool.zip
          generate_release_notes: true
